- name: Validate deployment settings
  ansible.builtin.assert:
    that:
      - analyses_root.startswith('/')
      - analyses_root != '/'
      - analyses_project_name is match('^[a-z0-9][a-z0-9_-]+$')
      - analyses_owner_id is match('^[A-Za-z0-9_-]{1,100}$')
      - analyses_profile_id is match('^[A-Za-z0-9_-]{1,100}$')
      - analyses_api_bind in ['127.0.0.1', '0.0.0.0']
      - analyses_api_port | int > 1024
      - analyses_api_port | int < 65536
      - analyses_quota_bytes | int > 0
      - analyses_telegram_delivery_mode in ['disabled', 'dry_run']
      - analyses_vk_delivery_mode in ['disabled', 'dry_run']
      - analyses_max_delivery_mode in ['disabled', 'dry_run']
      - analyses_llama_image is match('^ghcr[.]io/ggml-org/llama[.]cpp:[A-Za-z0-9_-]+@sha256:[a-f0-9]{64}$')
      - "'\n' not in analyses_allowed_origins"
- name: Create deployment directories
  ansible.builtin.file:
    path: "{{ analyses_root }}/{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - source/services/notifications
    - source/workers/messenger_delivery
    - source/services/entitlements
    - source/packages/cloud_access
    - source/services/identity
    - source/services/documents
    - source/services/records
    - source/packages/medical_domain
    - source/packages/record_sync
    - source/services/processing
    - source/workers/document_processing
    - runtime/tessdata
- name: Protect server secret directory
  ansible.builtin.file:
    path: "{{ analyses_root }}/.secrets"
    state: directory
    mode: '0700'
- name: Copy only server build inputs
  ansible.builtin.copy:
    src: "{{ analyses_source_root }}/{{ item }}"
    dest: "{{ analyses_root }}/source/{{ item }}"
    mode: '0644'
    directory_mode: '0755'
  loop:
    - services/notifications/Dockerfile
    - services/notifications/pubspec.yaml
    - services/notifications/pubspec.lock
    - services/notifications/lib/
    - services/notifications/bin/
    - workers/messenger_delivery/Dockerfile
    - workers/messenger_delivery/pubspec.yaml
    - workers/messenger_delivery/pubspec.lock
    - workers/messenger_delivery/lib/
    - workers/messenger_delivery/bin/
    - packages/medical_domain/pubspec.yaml
    - packages/medical_domain/lib/
    - packages/record_sync/pubspec.yaml
    - packages/record_sync/lib/
    - packages/cloud_access/pubspec.yaml
    - packages/cloud_access/lib/
    - services/entitlements/Dockerfile
    - services/entitlements/pubspec.yaml
    - services/entitlements/pubspec.lock
    - services/entitlements/lib/
    - services/entitlements/bin/
    - services/records/Dockerfile
    - services/records/pubspec.yaml
    - services/records/pubspec.lock
    - services/records/lib/
    - services/records/bin/
    - .dockerignore
    - services/identity/Dockerfile
    - services/identity/.dockerignore
    - services/identity/pubspec.yaml
    - services/identity/pubspec.lock
    - services/identity/lib/
    - services/identity/bin/
    - services/documents/Dockerfile
    - services/documents/pubspec.yaml
    - services/documents/pubspec.lock
    - services/documents/lib/
    - services/documents/bin/
    - services/processing/Dockerfile
    - services/processing/pubspec.yaml
    - services/processing/pubspec.lock
    - services/processing/start.sh
    - services/processing/lib/
    - services/processing/bin/
    - workers/document_processing/worker.py
    - workers/document_processing/make_config.py
  register: server_source
- name: Copy Compose and database bootstrap
  ansible.builtin.copy:
    src: "{{ analyses_source_root }}/infra/server/{{ item }}"
    dest: "{{ analyses_root }}/{{ item }}"
    mode: '0644'
  loop: [compose.yaml, processing.sql, records.sql, identity.sql, entitlements.sql, notifications.sql, bootstrap_secrets.py]
- name: Ensure persistent server credentials without rotating existing keys
  ansible.builtin.command:
    argv: ["{{ ansible_facts.python.executable }}", "{{ analyses_root }}/bootstrap_secrets.py", "{{ analyses_root }}/.secrets/bootstrap.json"]
  register: credential_update
  changed_when: credential_update.stdout == "updated"
  no_log: true
- name: Read protected bootstrap credentials
  ansible.builtin.slurp:
    src: "{{ analyses_root }}/.secrets/bootstrap.json"
  register: server_bootstrap
  no_log: true
- name: Load bootstrap credentials
  ansible.builtin.set_fact:
    analyses_secrets: "{{ server_bootstrap.content | b64decode | from_json }}"
  no_log: true
- name: Write environment and private service configuration
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ analyses_root }}/{{ item.dest }}"
    mode: "{{ item.mode }}"
  loop:
    - {src: env.j2, dest: .env, mode: '0600'}
    # Parent directory is 0700; containers receive only these individual mounts.
    - {src: s3.json.j2, dest: .secrets/s3.json, mode: '0644'}
    - {src: identities.json.j2, dest: .secrets/identities.json, mode: '0644'}
  no_log: true
- name: Download and verify fixed model and OCR artifacts
  ansible.builtin.get_url:
    url: "{{ item.url }}"
    dest: "{{ analyses_root }}/runtime/{{ item.name }}"
    checksum: "sha256:{{ item.sha256 }}"
    mode: '0644'
    timeout: 60
  loop: "{{ analyses_runtime_artifacts }}"
  loop_control:
    label: "{{ item.name }}"
- name: Write reproducible runtime manifest
  ansible.builtin.template:
    src: manifest.json.j2
    dest: "{{ analyses_root }}/runtime/manifest.json"
    mode: '0644'
- name: Build and start all server services
  community.docker.docker_compose_v2:
    project_src: "{{ analyses_root }}"
    project_name: "{{ analyses_project_name }}"
    state: present
    build: "{{ 'always' if server_source.changed else 'policy' }}"
    profiles: "{{ (['test-mail'] if analyses_smtp_host == 'mailpit' else []) + (['messengers'] if analyses_messengers_enabled | bool else []) }}"
    wait: true
    wait_timeout: "{{ analyses_wait_timeout }}"
    remove_orphans: false
    remove_volumes: false
  no_log: true
- name: Wait for Documents API
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ analyses_api_port }}/health"
    return_content: false
  register: documents_health
  until: documents_health.status == 200
  retries: 30
  delay: 2
- name: Verify authenticated server processing capability
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ analyses_api_port }}/v1/profiles/{{ analyses_profile_id }}/processing-capabilities"
    headers:
      Authorization: "Bearer {{ analyses_secrets.client_token }}"
    return_content: true
  register: processing_health
  until: processing_health.status == 200 and processing_health.json.ready | default(false)
  retries: 30
  delay: 2
  no_log: true

- name: Verify authorized records synchronization capability
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ analyses_api_port }}/v1/profiles/{{ analyses_profile_id }}/sync-access"
    headers:
      Authorization: "Bearer {{ analyses_secrets.client_token }}"
    return_content: true
  register: records_health
  until: records_health.status == 200 and records_health.json.schemaVersion | default(0) == 1
  retries: 30
  delay: 2
  no_log: true

- name: Verify accounts API readiness
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ analyses_api_port }}/v1/auth/session"
    status_code: 401
  register: identity_health
  until: identity_health.status == 401
  retries: 30
  delay: 2

- name: Verify cloud rights and quota capability
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ analyses_api_port }}/v1/profiles/{{ analyses_profile_id }}/cloud-access"
    headers:
      Authorization: "Bearer {{ analyses_secrets.client_token }}"
    return_content: true
  register: cloud_health
  until: cloud_health.status == 200 and cloud_health.json.policy.schemaVersion | default(0) == 1
  retries: 30
  delay: 2
  no_log: true

- name: Verify internal notification queue readiness
  ansible.builtin.command:
    argv: [docker, compose, --profile, messengers, exec, -T, notifications, /app/notifications, --health]
    chdir: "{{ analyses_root }}"
  changed_when: false
  when: analyses_messengers_enabled | bool
  no_log: true
