openapi: 3.1.0
info:
  title: Public Provider Directory and Source Registry
  version: 1.0.0
  description: >-
    Public reference data only. Each connector credential belongs to exactly one
    source. Admin credentials control schedules and read import history.
    Observed doctor/service listings do not approve medical terminology or practices.
paths:
  /health:
    get:
      responses:
        '200': {description: Schema and database ready}
        '503': {description: Database unavailable}
  /v1/directory/catalog:
    get:
      description: Latest usable additive snapshot, compatible with provider_directory schema 1.
      responses:
        '200':
          description: Published snapshot; row checkedAt values retain their own age.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Catalog'}
  /v1/directory/sources:
    get:
      responses:
        '200':
          description: Source configuration and effective schedule/status, without credentials or leases.
          content:
            application/json:
              schema:
                type: object
                required: [schemaVersion, sources]
                properties:
                  schemaVersion: {const: 1}
                  sources:
                    type: array
                    items:
                      type: object
                      required: [id, configuration, enabled, intervalSeconds, nextRunAt, running]
                      properties:
                        id: {type: string}
                        configuration: {type: object}
                        enabled: {type: boolean}
                        intervalSeconds: {type: integer, minimum: 3600, maximum: 604800}
                        nextRunAt: {type: string, format: date-time}
                        lastSuccessAt: {type: [string, 'null'], format: date-time}
                        lastError: {type: [string, 'null']}
                        running: {type: boolean}
  /internal/sources/{sourceId}/claim:
    parameters:
      - {$ref: '#/components/parameters/SourceId'}
    post:
      security: [{Connector: []}]
      description: >-
        Atomically claim this source's due job. Returns job null when disabled,
        not due or leased. An expired job keeps its ID and receives a new lease,
        at most three attempts. The old lease cannot complete it.
      responses:
        '200':
          description: Job or no work
          content:
            application/json:
              schema:
                type: object
                required: [job]
                properties:
                  job:
                    oneOf:
                      - {type: 'null'}
                      -
                        type: object
                        required: [schemaVersion, jobId, lease, config]
                        properties:
                          schemaVersion: {const: 1}
                          jobId: {type: string}
                          lease: {type: string}
                          config: {type: object}
        '401': {description: Wrong source credential}
  /internal/sources/{sourceId}/jobs/{jobId}:
    parameters:
      - {$ref: '#/components/parameters/SourceId'}
      - {in: path, name: jobId, required: true, schema: {type: string}}
    post:
      security: [{Connector: []}]
      description: >-
        Heartbeat extends the lease by 120 seconds. Completion atomically stores
        snapshot, observations, receipt and DirectoryPublished outbox event.
        Identical result replay returns the previous summary without another event.
        Changed replay or expired/reassigned lease returns 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                -
                  type: object
                  required: [action, lease]
                  properties:
                    action: {const: heartbeat}
                    lease: {type: string}
                -
                  type: object
                  required: [action, lease, error]
                  properties:
                    action: {const: fail}
                    lease: {type: string}
                    error: {type: string, pattern: '^[a-z0-9_]{1,80}$'}
                -
                  type: object
                  required: [action, lease, result]
                  properties:
                    action: {const: complete}
                    lease: {type: string}
                    result: {$ref: '#/components/schemas/Import'}
      responses:
        '200': {description: Heartbeat/failure acknowledged or immutable publication summary}
        '400': {description: Invalid source data, missing city, suspicious shrinkage or schema}
        '401': {description: Wrong source credential}
        '409': {description: Lost lease or result_mismatch}
        '413': {description: Request exceeds 16 MiB}
        '503': {description: Database unavailable; retry same immutable command}
  /internal/sources/{sourceId}/settings:
    parameters:
      - {$ref: '#/components/parameters/SourceId'}
    patch:
      security: [{Admin: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled, intervalSeconds]
              properties:
                enabled: {type: boolean}
                intervalSeconds: {type: integer, minimum: 3600, maximum: 604800}
      responses:
        '200': {description: Durable settings updated; a running job may finish}
        '401': {description: Admin credential required}
  /internal/sources/{sourceId}/refresh:
    parameters:
      - {$ref: '#/components/parameters/SourceId'}
    post:
      security: [{Admin: []}]
      responses:
        '200': {description: Set next run to now without enabling source or duplicating active job}
        '401': {description: Admin credential required}
  /internal/sources/{sourceId}/runs:
    parameters:
      - {$ref: '#/components/parameters/SourceId'}
    get:
      security: [{Admin: []}]
      responses:
        '200': {description: Last 30 jobs with attempts, timestamps, errors and summaries; no lease}
        '401': {description: Admin credential required}
  /internal/sources/{sourceId}/items:
    parameters:
      - {$ref: '#/components/parameters/SourceId'}
    get:
      security: [{Admin: []}]
      responses:
        '200': {description: Additive source observations; checkedAt belongs to each row}
        '401': {description: Admin credential required}
components:
  securitySchemes:
    Admin: {type: http, scheme: bearer}
    Connector: {type: http, scheme: bearer}
  parameters:
    SourceId:
      in: path
      name: sourceId
      required: true
      schema:
        type: string
        enum: [invitro, helix, smclinic, scandinavia, sova, medexpert, csp]
  schemas:
    Branch:
      type: object
      required: [id, network, city, name, address, phone, website, source, checkedAt]
      properties:
        id: {type: string}
        sourceId: {type: string}
        network: {type: string}
        city: {enum: [spb, voronezh]}
        name: {type: string, minLength: 1}
        address: {type: string, minLength: 1}
        phone: {type: string}
        phoneScope: {enum: [network, city, branch]}
        phoneCheckedAt: {type: string, format: date}
        website: {type: string, format: uri}
        source: {type: string, format: uri}
        checkedAt: {type: string, format: date}
        lat: {type: number, minimum: -90, maximum: 90}
        lon: {type: number, minimum: -180, maximum: 180}
    Observation:
      type: object
      required: [id, network, city, kind, name, source, checkedAt]
      properties:
        id: {type: string}
        network: {type: string}
        city: {enum: [spb, voronezh]}
        kind: {enum: [doctor, test, service, specialty, category]}
        name: {type: string, minLength: 1, maxLength: 1000}
        sourceCode: {type: string}
        sourcePrice: {type: string, description: Original text; may include currency or a starting-price qualifier}
        source: {type: string, format: uri}
        checkedAt: {type: string, format: date}
        availabilityStatus: {enum: [unverified, city_network_offer]}
    Import:
      type: object
      required: [schemaVersion, sourceId, parserVersion, fetchedAt, branches, items, catalogueStatus]
      properties:
        schemaVersion: {const: 1}
        sourceId: {type: string}
        parserVersion: {type: string}
        fetchedAt: {type: string, format: date-time}
        branches:
          type: array
          minItems: 1
          maxItems: 5000
          items: {$ref: '#/components/schemas/Branch'}
        items:
          type: array
          maxItems: 30000
          items: {$ref: '#/components/schemas/Observation'}
        catalogueStatus:
          type: array
          items:
            type: object
            required: [url, city, status, pages, items]
            properties:
              url: {type: string, format: uri}
              city: {enum: [spb, voronezh]}
              status: {enum: [observed, failed]}
              pages: {type: integer}
              items: {type: integer}
              error: {type: string}
              coverage:
                enum: [complete, partial]
                description: Required by parser v2. Completeness of the configured collection, not medical verification or the entire city.
              coverageMethod:
                enum: [source_total, linked_sections]
              expectedItems:
                type: integer
                minimum: 0
                description: The source's published listing total; complete source_total requires observedRows to match it. Repeated placements can share one unique item.
              observedRows: {type: integer, minimum: 0}
              duplicateRows: {type: integer, minimum: 0}
              successfulPages: {type: integer, minimum: 0}
              pendingPages: {type: integer, minimum: 0}
              failures:
                type: array
                items:
                  type: object
                  required: [url, error]
                  properties:
                    url: {type: string, format: uri}
                    error: {type: string}
    Catalog:
      type: object
      required: [schemaVersion, version, checkedAt, branches, doctors, tests]
      properties:
        schemaVersion: {const: 1}
        version: {type: string}
        checkedAt: {type: string, format: date, description: Date of the reviewed seed, not a promise that every row was refreshed}
        publishedAt: {type: string, format: date-time}
        branches:
          type: array
          items: {$ref: '#/components/schemas/Branch'}
        doctors: {type: array, items: {type: object}, description: Reviewed practices from the seed}
        tests: {type: array, items: {type: object}, description: Reviewed source offers and terminology release}
        sourceStates: {type: object, description: Per-source latest publication timestamp, parser version and catalogueStatus}

        coverageReviewBranches:
          type: array
          description: Preserved regional source facts excluded from pilot city search pending address coverage review.
          items: {$ref: '#/components/schemas/Branch'}
        branchIdentityAliases:
          type: object
          additionalProperties: {type: string}
          description: Reviewed duplicate source IDs mapped to their preserved canonical IDs.
        branchIdentityReview:
          type: array
          items: {$ref: '#/components/schemas/Branch'}
          description: Original rows preserved by an explicit branch identity correction.
