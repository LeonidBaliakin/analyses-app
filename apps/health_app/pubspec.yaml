name: health_app
description: Local-first health records application.
publish_to: 'none'
version: 0.1.3+4
resolution: workspace

environment:
  sdk: ^3.14.0

dependencies:
  medical_domain: ^0.1.0
  medical_terminology: ^0.1.0
  document_domain: ^0.1.0
  document_processing: ^0.1.0
  http: ^1.6.0
  local_store: ^0.1.0
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  uuid: ^4.6.0
  cupertino_ui: ^1.1.7
  material_ui: ^1.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  design_system: ^0.1.0
  flutter_svg: ^2.5.0
  go_router: ^18.1.4
  intl: ^0.20.2
  shared_preferences: ^2.5.6
  geolocator: ^14.1.2
  image_picker: ^1.2.4
  file_selector: ^1.1.0

dev_dependencies:
  drift: ^2.35.4
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
